<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini WhatsApp</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#d9dbd5;height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:min(100%,1000px);height:94vh;background:#efeae2;display:flex;overflow:hidden;box-shadow:0 8px 30px #0002;border-radius:12px}
aside{width:310px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
.sideHead{background:#f0f2f5;padding:16px;font-weight:bold;display:flex;justify-content:space-between}
.search{margin:10px;padding:10px 14px;border:0;background:#f0f2f5;border-radius:20px;outline:0}
.people{padding:10px 16px;color:#555;overflow:auto}
.person{padding:9px 0;border-bottom:1px solid #eee}
.chat{flex:1;display:flex;flex-direction:column}
.top{background:#f0f2f5;padding:15px 20px;font-weight:bold;border-bottom:1px solid #ddd}
.status{font-size:12px;color:#667781;font-weight:normal;margin-top:3px}
.messages{flex:1;overflow:auto;padding:20px;background:
radial-gradient(#fff8 1px,transparent 1px);background-size:18px 18px}
.msg{max-width:75%;padding:9px 12px;margin:7px 0;border-radius:10px;background:#fff;box-shadow:0 1px 1px #0001}
.msg.me{margin-left:auto;background:#d9fdd3}
.msg .user{font-size:12px;font-weight:bold;color:#0b7b6c;margin-bottom:3px}
.msg .time{font-size:10px;color:#667781;text-align:right;margin-top:4px}
.system{text-align:center;color:#667781;font-size:12px;margin:8px}
.form{background:#f0f2f5;padding:10px;display:flex;gap:8px}
.form input{flex:1;border:0;border-radius:22px;padding:13px 16px;outline:0;font-size:15px}
.form button{border:0;border-radius:50%;width:45px;height:45px;background:#25d366;color:#fff;font-size:18px;cursor:pointer}
.overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center}
.login{background:white;padding:28px;border-radius:16px;width:min(90%,380px)}
.login h1{margin-top:0}
.login input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
.login button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#25d366;color:white;font-weight:bold;cursor:pointer}
@media(max-width:700px){
 body{align-items:stretch}
 .app{height:100vh;width:100%;border-radius:0}
 aside{width:115px}
 .sideHead span{display:none}
 .person{font-size:13px}
 .people{padding:8px}
}
</style>
</head>
<body>
<div class="overlay" id="login">
  <div class="login">
    <h1>💬 Mini WhatsApp</h1>
    <p>Elige tu nombre para entrar al chat.</p>
    <input id="name" maxlength="24" placeholder="Tu nombre">
    <button id="enter">Entrar</button>
  </div>
</div>

<div class="app">
  <aside>
    <div class="sideHead"><span>Chats</span>🟢</div>
    <input class="search" placeholder="Buscar">
    <div class="people" id="people">Conectando...</div>
  </aside>
  <section class="chat">
    <div class="top">
      🌐 Chat general
      <div class="status" id="status">Conecta para empezar</div>
    </div>
    <div class="messages" id="messages"></div>
    <form class="form" id="form">
      <input id="input" autocomplete="off" placeholder="Escribe un mensaje...">
      <button>➤</button>
    </form>
  </section>
</div>

<script>
const socket = io();
let myName = localStorage.getItem("miniName") || "";

const login = document.getElementById("login");
const nameInput = document.getElementById("name");
const enter = document.getElementById("enter");
const messages = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const people = document.getElementById("people");
const status = document.getElementById("status");

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function time(iso){
  return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
function addMessage(m){
  const div=document.createElement("div");
  div.className="msg"+(m.user===myName?" me":"");
  div.innerHTML=`<div class="user">${escapeHtml(m.user)}</div>
                 <div>${escapeHtml(m.text)}</div>
                 <div class="time">${time(m.time)}</div>`;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}
function enterChat(){
  const n=nameInput.value.trim();
  if(!n) return;
  myName=n.slice(0,24);
  localStorage.setItem("miniName",myName);
  login.style.display="none";
  socket.emit("join",myName);
  status.textContent="En línea";
  input.focus();
}
enter.onclick=enterChat;
nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")enterChat()});

if(myName){
  nameInput.value=myName;
  enterChat();
}

socket.on("history", list=>list.forEach(addMessage));
socket.on("chat message", addMessage);
socket.on("system", text=>{
  const div=document.createElement("div");
  div.className="system";
  div.textContent=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
});
socket.on("users", list=>{
  people.innerHTML = list.length
    ? list.map(u=>`<div class="person">🟢 ${escapeHtml(u)}</div>`).join("")
    : "Nadie conectado";
  status.textContent = `${list.length} conectado${list.length===1?"":"s"}`;
});

form.addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text) return;
  socket.emit("chat message",text);
  input.value="";
});
</script>
</body>
</html>
